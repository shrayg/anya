<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="30" />
  <title>Anya.Int — Updating</title>
  <style>
    :root {
      --bg: #050505;
      --fg: #f2f2f2;
      --muted: #9a9a9a;
      --blush: #f0a4b8;
      --line: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(240, 164, 184, 0.12), transparent 60%),
        linear-gradient(180deg, #0a0a0a 0%, #050505 100%);
    }
    .card {
      width: min(34rem, 100%);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 2.5rem 1.75rem;
      background: rgba(12, 12, 12, 0.85);
      backdrop-filter: blur(10px);
    }
    .brand {
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: var(--blush);
      margin: 0 0 1.25rem;
    }
    h1 {
      margin: 0 0 0.85rem;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    p {
      margin: 0 auto;
      max-width: 28rem;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }
    .pulse {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 999px;
      background: var(--blush);
      margin: 0 auto 1.25rem;
      box-shadow: 0 0 0 0 rgba(240, 164, 184, 0.55);
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(240, 164, 184, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(240, 164, 184, 0); }
      100% { box-shadow: 0 0 0 0 rgba(240, 164, 184, 0); }
    }
    .meta {
      margin-top: 1.75rem;
      font-size: 0.8rem;
      color: #6e6e6e;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="pulse" aria-hidden="true"></div>
    <p class="brand">Anya.Int</p>
    <h1>Site is updating right now</h1>
    <p>
      We are adding new features. Please be patient — the platform will be back
      up in a couple of minutes.
    </p>
    <p class="meta">This page refreshes automatically</p>
  </main>
</body>
</html>
