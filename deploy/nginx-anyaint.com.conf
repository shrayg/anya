server {
    server_name anyaint.com www.anyaint.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ~* \.map$ {
        deny all;
        return 404;
    }

    location = /maintenance.html {
        root /var/www/anya-maintenance;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Retry-After "120" always;
    }

    error_page 502 503 504 =503 /maintenance.html;

    location / {
        if (-f /var/www/anya-maintenance/ON) {
            return 503;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/anyaint.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/anyaint.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.anyaint.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = anyaint.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name anyaint.com www.anyaint.com;
    return 404; # managed by Certbot
}
