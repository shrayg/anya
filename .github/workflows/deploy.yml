name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys — never cancel a mid-flight build (that left production down).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'fillingorders/anya.int'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP_DIR
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/var/www/anya.int}"
            cd "$APP_DIR"
            # All git/build/PM2 work happens inside the flock-guarded script.
            bash scripts/vps-pull-deploy.sh
