name: Cloudflare zone settings

on:
  workflow_dispatch:
  push:
    paths:
      - infra/cloudflare/**
      - scripts/set-cloudflare-challenge-ttl.mts
    branches: [main]

jobs:
  challenge-ttl:
    runs-on: ubuntu-latest
    if: github.repository == 'fillingorders/anya.int'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Set Challenge Passage (challenge_ttl → 2 hours)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: npx tsx scripts/set-cloudflare-challenge-ttl.mts
